<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Sistema Conte Nic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar oscura fija + área de trabajo clara; herramienta operativa, tarjetas y tablas simples */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface2:#F7F8F4; --ink:#17212B; --muted:#5A6570; --line:#DADDD4; --line2:#E8EAE3;
  --accent:#C9520A; --accent-2:#FCE7D6; --accent-ink:#FFFFFF; --focus:#2B6CB0;
  --side:#16202B; --side-ink:#D9E0E6; --side-muted:#8E9BA8; --side-hi:#243343;
  --ok:#1F6F44; --ok-bg:#DFF1E5; --warn:#8F5A00; --warn-bg:#FBEFCF; --bad:#B02A21; --bad-bg:#FADFDB;
  --info:#1D5A97; --info-bg:#DDEAF7; --rep:#673FA0; --rep-bg:#ECE3F7; --off:#5A6570; --off-bg:#E7E9E3;
  --map-bg:#EEF0E7; --map-hill:#DEE4D2; --map-hill2:#D0D9C2; --map-road:#DF9A55; --map-water:#B7D4EA; --map-text:#46515C;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 10px 30px rgba(23,33,43,.08);
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D26; --surface2:#1A242E; --ink:#E6EBEF; --muted:#98A4AF; --line:#29353F; --line2:#202A34;
  --accent:#F07E34; --accent-2:#3A2415; --accent-ink:#17110C; --focus:#7DB4F0;
  --side:#0A0F14; --side-ink:#D9E0E6; --side-muted:#7E8C99; --side-hi:#18232E;
  --ok:#62C98E; --ok-bg:#15301F; --warn:#E9B24C; --warn-bg:#33280F; --bad:#F2837A; --bad-bg:#3B1A17;
  --info:#74AEEA; --info-bg:#152A40; --rep:#B696EA; --rep-bg:#2A1F3E; --off:#98A4AF; --off-bg:#222C36;
  --map-bg:#121A21; --map-hill:#19232C; --map-hill2:#202D38; --map-road:#B8702F; --map-water:#1E3D56; --map-text:#A5B0BA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D26; --surface2:#1A242E; --ink:#E6EBEF; --muted:#98A4AF; --line:#29353F; --line2:#202A34;
  --accent:#F07E34; --accent-2:#3A2415; --accent-ink:#17110C; --focus:#7DB4F0;
  --side:#0A0F14; --side-ink:#D9E0E6; --side-muted:#7E8C99; --side-hi:#18232E;
  --ok:#62C98E; --ok-bg:#15301F; --warn:#E9B24C; --warn-bg:#33280F; --bad:#F2837A; --bad-bg:#3B1A17;
  --info:#74AEEA; --info-bg:#152A40; --rep:#B696EA; --rep-bg:#2A1F3E; --off:#98A4AF; --off-bg:#222C36;
  --map-bg:#121A21; --map-hill:#19232C; --map-hill2:#202D38; --map-road:#B8702F; --map-water:#1E3D56; --map-text:#A5B0BA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.code{font-family:var(--f-cond);font-variant-numeric:tabular-nums}
.code{font-weight:600;font-size:16px;letter-spacing:.02em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.brand b{font:700 21px/1 var(--f-cond);letter-spacing:.02em;display:block;color:#F3F1EC}
.brand small{font-size:12px;color:var(--side-muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;background:transparent;border-radius:9px;color:var(--side-ink);font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:var(--side-hi)}
.nav button.on{background:var(--side-hi);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{margin-left:auto;font:600 12px/1 var(--f-body);padding:4px 8px;border-radius:999px;background:#3A2517;color:#FFB37A}
.nav .cnt.bad{background:#46201C;color:#FF9E94}
.me{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--side-hi)}
.me-row{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-cond);background:var(--accent);color:#fff;flex:none}
.me b{display:block;color:#fff}
.me small{color:var(--side-muted)}
.me button{min-height:36px;border:1px solid #33475A;background:transparent;color:var(--side-ink);border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.me button:hover{background:#2C3E50}

.main{min-width:0;padding:0 28px 56px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);margin-bottom:22px}
.menu{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;place-items:center}
.gs{position:relative;flex:1;max-width:560px}
.gs .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gs input{width:100%;min-height:44px;padding:0 14px 0 40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--f-body)}
.gs-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
.gs-res[hidden]{display:none}
.gs-res button{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:0;background:transparent;padding:10px;border-radius:8px;cursor:pointer}
.gs-res button:hover,.gs-res button:focus-visible{background:var(--surface2)}
.gs-res .k{font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:78px;flex:none}
.gs-res .t{min-width:0}
.gs-res .t small{display:block;color:var(--muted)}
.demo{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border:1px dashed var(--line);border-radius:999px;white-space:nowrap}

.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.ph h1{font:600 34px/1.05 var(--f-cond);letter-spacing:.01em}
.ph .sub{color:var(--muted);margin-top:4px}
.ph-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sec{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.block{margin-bottom:22px}

/* buttons, chips, badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.big{min-height:52px;font-size:16px;padding:0 22px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--bad-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip span{font-weight:500;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on span{color:inherit;opacity:.75}
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;line-height:1.35}
.b::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.ok{color:var(--ok);background:var(--ok-bg)}.warn{color:var(--warn);background:var(--warn-bg)}.bad{color:var(--bad);background:var(--bad-bg)}
.info{color:var(--info);background:var(--info-bg)}.rep{color:var(--rep);background:var(--rep-bg)}.off{color:var(--off);background:var(--off-bg)}.acc{color:var(--accent);background:var(--accent-2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.info{background:var(--info)}.dot.rep{background:var(--rep)}.dot.off{background:var(--off)}.dot.acc{background:var(--accent)}
.sz{display:inline-block;font:600 13px var(--f-cond);padding:2px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.2);vertical-align:middle;margin-right:6px}

/* dashboard */
.pc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rng{display:flex;gap:8px;align-items:center}
.rng input{min-height:38px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 14px var(--f-body)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;padding:16px 18px;min-height:112px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tile:hover{border-color:var(--muted)}
.tl-l{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:14px}
.tl-n{font:600 46px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.tile.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tile.dark .tl-l{color:inherit;opacity:.75}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h3{font:600 20px/1.1 var(--f-cond);letter-spacing:.01em;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel h3 small{font:500 13px var(--f-body);color:var(--muted)}
.kv{display:flex;flex-direction:column}
.kv-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.kv-row:first-child{border-top:0;padding-top:0}
.kv-row b{font:600 30px/1 var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv-row .l{min-width:0}
.kv-row .l{font-weight:600}
.kv-row .l small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.hb{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) 58px;align-items:center;gap:12px;padding:6px 0}
.hb-l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line2)}
.hb-t i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hb-v{text-align:right;font:600 18px var(--f-cond);font-variant-numeric:tabular-nums}
.hb small{color:var(--muted);font-weight:500}
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);text-align:left;cursor:pointer;width:100%}
.al:hover{border-color:var(--muted)}
.al b{display:block}
.al small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .n{font:600 30px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.al .n.zero{color:var(--muted)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart text{fill:var(--muted);font:12px var(--f-body)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .ce{fill:var(--accent)}
.chart .cr{fill:var(--info)}
.chart .today{fill:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;list-style:none;padding:0;margin:10px 0 0;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}

/* filters + tables */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters .grow{flex:1 1 240px;min-width:0}
.inp,.sel{min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--f-body);max-width:100%}
.inp{width:100%}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
td .sub{display:block;color:var(--muted);font-size:13px}
.late{color:var(--bad);font-weight:600}
.note{color:var(--muted);font-size:14px;margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* layers */
.layer{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.layer.dr{place-items:stretch;justify-items:end;padding:0}
.layer.dg{z-index:70}
.backdrop{position:absolute;inset:0;background:rgba(9,14,19,.52)}
.mpanel{position:relative;width:100%;max-width:1040px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mpanel.narrow{max-width:560px}
.dpanel{position:relative;width:min(600px,100%);height:100%;overflow:auto;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:2}
.m-head h2{font:600 30px/1.05 var(--f-cond)}
.m-head .eyebrow{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.m-head .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.m-body{padding:20px 24px;display:flex;flex-direction:column;gap:22px}
.m-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--surface)}
.m-foot .spacer{flex:1}
.op-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.sect{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.sect h3{font:600 19px/1.1 var(--f-cond);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sect h3 .who{font:500 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
dl.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0}
dl.dl dt{color:var(--muted);font-size:14px}
dl.dl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-weight:600;font-size:14px}
.fld input,.fld select,.fld textarea{font:500 15px var(--f-body);min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:64px}
.full{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;display:inline-flex}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;background:var(--surface)}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-2)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--bad);font-weight:600}
.warn-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line)}
.ok-box{padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ink)}
.selcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--accent);background:var(--accent-2);border-radius:10px}
.sug{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sug button{display:flex;justify-content:space-between;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.sug button:hover{border-color:var(--accent)}
.sug small{color:var(--muted)}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photo{width:150px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.photo img,.photo svg{width:150px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.up{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1.5px dashed var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface2)}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px;margin-left:6px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--off)}
.tl li.entregado::before{border-color:var(--info)}.tl li.retirado::before{border-color:var(--accent)}.tl li.disponible::before{border-color:var(--ok)}.tl li.reparacion::before{border-color:var(--rep)}.tl li.asignado::before{border-color:var(--muted)}
.tl .d{font:600 14px var(--f-cond);color:var(--muted);font-variant-numeric:tabular-nums}
.tl .t{font-weight:600}
.tl small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2)}
.stat b{display:block;font:600 28px/1.05 var(--f-cond);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;font-weight:600}
.dsec{display:flex;flex-direction:column;gap:10px}
.dsec h3{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 14px var(--f-cond);padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list>*{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line2);background:var(--surface);text-align:left;border-left:0;border-right:0;border-bottom:0;width:100%}
.list>*:first-child{border-top:0}
.list>button{cursor:pointer}
.list>button:hover{background:var(--surface2)}
.list small{color:var(--muted)}
details.hist summary{cursor:pointer;font-weight:600;color:var(--muted)}
.audit{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px}
.audit div{display:flex;gap:12px}
.audit time{font:600 13px var(--f-cond);color:var(--muted);width:86px;flex:none}

/* logística */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.col-h h3{font:600 19px var(--f-cond);display:flex;align-items:center;gap:8px}
.col-h .n{font:600 20px var(--f-cond);color:var(--muted)}
.jc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.jc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jc-top .time{font:600 20px var(--f-cond);font-variant-numeric:tabular-nums}
.jc b{font-size:16px}
.jc .addr{color:var(--muted);font-size:14px}
.jc .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.jc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.jc .acts .btn{flex:1 1 auto;white-space:normal;line-height:1.2;padding:8px 12px;text-align:center}
.jc-open{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%}
.done-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.done-list>div{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:14px}
.sumline{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.sumline .pill{display:inline-flex;gap:8px;align-items:baseline;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.sumline .pill b{font:600 22px var(--f-cond)}

/* mapa */
.mapwrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.mapside{display:flex;flex-direction:column;gap:12px;min-width:0}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto;padding-right:2px}
.mitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer}
.mitem.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mitem small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapbox{position:relative;background:var(--map-bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox>svg{display:block;width:100%;height:min(78vh,780px)}
.mapbox .zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.m-hill{fill:var(--map-hill)}.m-hill2{fill:var(--map-hill2)}.m-road{fill:none;stroke:var(--map-road);stroke-linecap:round;stroke-linejoin:round}
.m-water{fill:var(--map-water)}.m-town{fill:var(--map-text)}.m-lbl{fill:var(--map-text);font-family:var(--f-body);font-weight:600}
.m-mk{stroke:var(--surface);cursor:pointer}
.m-mk.info{fill:var(--info)}.m-mk.warn{fill:var(--warn)}.m-mk.bad{fill:var(--bad)}
.m-sel{fill:none;stroke:var(--ink)}
.m-dep{fill:var(--ink)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* pagos / choferes / reportes */
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.fig{padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.fig span{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:14px}
.fig b{display:block;font:600 32px/1.1 var(--f-cond);margin-top:6px;font-variant-numeric:tabular-nums}
.fig small{color:var(--muted)}
.drivers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.drv{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer}
.drv.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.drv-h{display:flex;align-items:center;gap:12px}
.drv-h b{font:600 22px var(--f-cond);display:block}
.drv-big{display:flex;align-items:baseline;gap:8px}
.drv-big b{font:600 52px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.drv-br{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drv-br div{padding:8px 10px;border-radius:8px;background:var(--surface2)}
.drv-br b{display:block;font:600 20px var(--f-cond)}
.drv-br span{font-size:12px;color:var(--muted);font-weight:600}
.soon{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.soon span{padding:6px 12px;border-radius:999px;border:1px dashed var(--line);color:var(--muted);font-weight:600;font-size:13px}
.stack{display:flex;height:22px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line2)}
.stack i{display:block;min-width:4px}
.bg-ok{background:var(--ok)}.bg-info{background:var(--info)}.bg-warn{background:var(--warn)}.bg-rep{background:var(--rep)}.bg-off{background:var(--off)}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix .ic{color:var(--ok)}
.matrix .no{color:var(--line)}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:40px;padding-inline:16px}
.login .brand b{color:var(--ink);font-size:28px}
.login .brand small{color:var(--muted);font-size:13px}
.login h1{font:600 44px/1 var(--f-cond);text-align:center}
.login p.lead{color:var(--muted);text-align:center;max-width:52ch}
.who{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:1040px}
.whoc{display:flex;flex-direction:column;gap:12px;text-align:left;padding:20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:220px}
.whoc:hover{border-color:var(--accent)}
.whoc .av{width:48px;height:48px;font-size:20px}
.whoc b{font:600 26px var(--f-cond)}
.whoc p{color:var(--muted);font-size:14px;flex:1}
.whoc .go{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--accent)}

.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100% - 32px))}
.toast div{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;display:flex;gap:10px;align-items:center}
.sb-back{display:none}

@media (max-width:1200px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.op-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.op-grid .sect.lg{grid-column:1/-1;order:-1}.cards4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .sb-back{display:block;position:fixed;inset:0;background:rgba(9,14,19,.5);z-index:35}
  .menu{display:grid}
  .main{padding:0 16px 48px}
  .grid3,.grid2,.rep-grid{grid-template-columns:minmax(0,1fr)}
  .mapwrap{grid-template-columns:minmax(0,1fr)}
  .mapside{order:2}
  .drivers{grid-template-columns:minmax(0,1fr)}
  .who{grid-template-columns:repeat(2,minmax(0,1fr))}
  .demo{display:none}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board,.op-grid,.fgrid{grid-template-columns:minmax(0,1fr)}
  .who{grid-template-columns:minmax(0,1fr)}
  .whoc{min-height:0}
  .cards4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ph h1{font-size:30px}
  .m-head,.m-body,.m-foot{padding-left:16px;padding-right:16px}
  .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tl-n{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2: agenda, pills de chofer, inicio en tarjetas */
.pd{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.pd.info{background:var(--info);color:var(--surface)}.pd.ok{background:var(--ok);color:var(--surface)}.pd.rep{background:var(--rep);color:var(--surface)}.pd.acc{background:var(--accent);color:var(--surface)}
.pd.off{background:var(--off-bg);color:var(--muted);font-weight:600}
.day{margin-bottom:22px}
.dayh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px 12px 0 0}
.dayh h2{font:600 19px var(--f-cond);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.dayh small{font-size:13px;opacity:.8;font-weight:500}
.day .tbl-wrap{border-radius:0 0 12px 12px;border-top:0}
.day td{vertical-align:top}
.addrow{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:12px;border:0;border-top:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.addrow:hover{color:var(--ink);background:var(--surface2)}
.pc-tag{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--warn-bg);color:var(--warn);border:1px dashed var(--warn);white-space:nowrap}
.st-tag{display:inline-flex;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--info-bg);color:var(--info);white-space:nowrap}
.ico{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--ink)}
.tile.dark .ico{background:transparent;border-color:rgba(255,255,255,.25);color:inherit}
.tiles7{grid-template-columns:repeat(7,minmax(0,1fr))}
.tiles5{grid-template-columns:1.25fr repeat(4,minmax(0,1fr))}
.tiles4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile.sm{min-height:96px}
.tile.sm .tl-n{font-size:30px}
.tile small{color:var(--muted);font-size:13px;font-weight:500}
.tile.dark small{color:inherit;opacity:.7}
.fuel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink)}
.fcard .h{display:flex;align-items:center;gap:10px;font:600 22px var(--f-cond)}
.fcard .h small{font:500 13px var(--f-body);color:var(--muted)}
.fcard .v{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcard .v span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.fcard .v b{display:block;font:600 26px var(--f-cond);font-variant-numeric:tabular-nums}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 10px}
.sechead .sec{margin:0}
.sechead span{color:var(--muted);font-size:14px}
.cname{font:600 16px var(--f-cond);letter-spacing:.02em;white-space:nowrap}
.sel.sm{min-height:36px;font-size:14px;padding:0 8px}
.cmb{max-width:220px}
.tiles7 .tl-n{font-size:26px;white-space:nowrap}
.fcard .v>span{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.fcard .v>span>span{display:flex;align-items:center;gap:6px}
table.dense td,table.dense th{padding:10px 10px}
table.dense td{font-size:14px}
table.dense th{font-size:11px}
table.dense td:first-child,table.dense th:first-child{padding-left:14px}
td a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
td a:hover{text-decoration-color:var(--accent)}
.cmb{max-width:170px}
.day td:nth-child(4){min-width:150px}
.day td:nth-child(5){white-space:nowrap}
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,

let LMAP=null,MAPMODE=typeof L!=='undefined'?'try':'schem',TILE_OK=false;
function killMap(){if(LMAP){try{S.mapView={c:LMAP.getCenter(),z:LMAP.getZoom()};LMAP.remove()}catch(e){}LMAP=null}}
function mapFail(){if(MAPMODE!=='try')return;MAPMODE='schem';killMap();if(S.view==='mapa'&&S.user)render()}
function initMap(){
 const el=byId('lmap');if(!el||MAPMODE==='schem')return;
 const m=L.map(el,{zoomControl:true});LMAP=m;
 const web=location.protocol==='http:'||location.protocol==='https:';
 const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
 const esriSt=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Mapa © Esri, OpenStreetMap'});
 const esriSat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imágenes © Esri'});
 const calles=web&&!/github\.io$/.test(location.hostname)?esriSt:(web?osm:esriSt);
 const base={'Calles':calles,'Satélite':esriSat};S.mapBase=S.mapBase||'Calles';
 const t=base[S.mapBase].addTo(m);L.control.layers(base,null,{collapsed:false}).addTo(m);
 m.on('baselayerchange',e=>{S.mapBase=e.name});
 t.on('tileload',()=>{TILE_OK=true;if(MAPMODE==='try')MAPMODE='ok'});
 t.on('tileerror',()=>{if(!TILE_OK)setTimeout(()=>{if(!TILE_OK)mapFail()},600)});
 if(MAPMODE==='try')setTimeout(()=>{if(!TILE_OK)mapFail()},5000);
 if(S.mzoom&&LOCS[S.mzoom])m.setView([LOCS[S.mzoom].lat,LOCS[S.mzoom].lng],14);

function dayChart(a,b){
 if(b-a<6)a=b-13;if(a<TODAY-60)a=TODAY-41;
 const days=[];for(let d=a;d<=b;d++)days.push(d);
 const map={};days.forEach(d=>map[d]={e:0,r:0});
 DB.ops.forEach(o=>{if(o.status==='Cancelado')return;if(map[o.delDay])map[o.delDay].e++;if(map[o.pickDay]&&!o.closedByRecambio)map[o.pickDay].r++});
 const max=Math.max(4,...days.map(d=>map[d].e+map[d].r)),top=Math.ceil(max/10)*10;
 const step=days.length>24?22:28,bw=step-8,W=44+days.length*step,H=190,ch=150,y0=16,Y=v=>y0+ch-(v/top*ch);
 let s=`<svg viewBox="0 0 ${W} ${H+14}" role="img" aria-label="Servicios por día">`;
 [0,top/2,top].forEach(v=>{s+=`<line class="gl" x1="36" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/><text x="30" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
 days.forEach((d,i)=>{const x=40+i*step,{e,r}=map[d];s+=`<g><title>${fs(d)}: ${e} entregas, ${r} retiros</title><rect class="ce" x="${x}" y="${Y(e)}" width="${bw}" height="${Math.max(0,Y(0)-Y(e))}" rx="2"/><rect class="cr" x="${x}" y="${Y(e+r)}" width="${bw}" height="${Math.max(0,Y(e)-Y(e+r))}" rx="2"/></g>`;if(days.length<=24||i%2===(days.length-1)%2)s+=`<text x="${x+bw/2}" y="${y0+ch+18}" text-anchor="middle" class="${d===TODAY?'today':''}">${Dt(d).getUTCDate()}</text>`});
 return `<div class="chart">${s}</svg></div><ul class="legend"><li><i class="dot acc"></i>Entregas y recambios</li><li><i class="dot info"></i>Retiros</li></ul>`;
}

 salFile:t=>{const f=t.files[0];byId('sl-fn').textContent=f?f.name:'Adjuntar foto o PDF'},
 gxFile:t=>{const f=t.files[0];byId('gx-fn').textContent=f?f.name:'Adjuntar foto o PDF'},
 pslot:t=>{const o=O(t.dataset.id);o.pickSlot=t.value;audNow(`${S.user.name} fijó el horario de retiro de ${o.cids.join(', ')}: ${t.value}`,o.id);toast(`Retiro de ${o.cids.join(', ')}: ${t.value}.`)},
 pdrv:t=>{const o=O(t.dataset.id);o.pickDriverPlan=+t.value;audNow(`${S.user.name} asignó a ${dname(+t.value)} el retiro de ${o.cids.join(', ')}`,o.id);toast(`Retiro de ${o.cids.join(', ')}: ${dname(+t.value)}.`)},
 combine:t=>{if(!t.value)return;const o=O(t.dataset.id),x=O(t.value);const ret=isActive(o)?o:x,ent=ret===o?x:o;
  const d=ret.pickDriverPlan||ret.driverId||ent.driverId;ret.sameTrip=ent.id;ent.sameTrip=ret.id;ret.pickDriverPlan=d;if(!ent.driverId){ent.driverId=d;if(ent.status==='Solicitado')ent.status='Confirmado';if(!ent.remito)ent.remito=++DB.seq.remito}else ret.pickDriverPlan=ent.driverId;
  ret.pickSlot=ent.slot;const dd=ent.driverId;ent.pickDriverPlan=ent.pickDriverPlan||dd;
  audNow(`${S.user.name} combinó en el mismo viaje la entrega ${opn(ent.id)} y el retiro de ${ret.cids.join(', ')} en ${addr(ent).barrio}`,ent.id);
  render();toast(`Mismo viaje en ${addr(ent).barrio}: ${dname(dd)} entrega a ${cust(ent).name} y retira ${ret.cids.join(', ')}.`)},
 payFile:t=>{const f=t.files[0];byId('py-fn').textContent=f?f.name:'Adjuntar foto o PDF'}
};
document.addEventListener('click',e=>{if(e.target.closest('a[target="_blank"]'))return;const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT'||t.tagName==='SELECT')return;const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset,t,e)}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.dialog)ACT.closeDialog();else if(S.modal)ACT.closeModal();else if(S.drawer)ACT.closeDrawer();else if(byId('gq-res'))byId('gq-res').hidden=true;return}
 if(e.key==='Enter'&&(e.target.id==='lg-user'||e.target.id==='lg-pass')){ACT.doLogin();return}
 if(e.key==='Enter'){const t=e.target;if(t.matches&&t.matches('tr[data-act],g[data-act]')){e.preventDefault();t.click()}if(t.id==='gq'){const b=document.querySelector('#gq-res button');if(b)b.click()}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){setF(t.dataset.f,t.value);render();return}if(t.dataset.live&&LIVE[t.dataset.live])LIVE[t.dataset.live](t)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.chg&&LIVE[t.dataset.chg])LIVE[t.dataset.chg](t);
 if(t.name==='no-type'){byId('no-rec').innerHTML=recBlock();const ex=t.value==='Extensión',mv=t.value!=='Alquiler';byId('no-qty-box').hidden=mv;byId('no-size-box').hidden=mv;if(ex)byId('no-price').value='';else if(!byId('no-price').value)byId('no-price').value=DEFP[val('no-size')]}
 if(t.name==='no-size'){const q=+(val('no-qty')||1);byId('no-price').value=DEFP[t.value]*q}
 if(t.name==='no-qty'){byId('no-price').value=DEFP[val('no-size')]*+t.value}
 if(t.name==='no-pay'){byId('no-acct-box').hidden=t.value!=='Transferencia';byId('no-cash-box').hidden=t.value!=='Efectivo';byId('no-ch-box').hidden=t.value!=='Grupo Chamba'}
 if(t.name==='py-m'){byId('py-acct-box').hidden=t.value!=='Transferencia';byId('py-cash-box').hidden=t.value!=='Efectivo'}
 if(t.name==='fu-dr'){const d=drv(t.value);if(d&&d.plates[0])byId('fu-p').value=d.plates[0];else byId('fu-p').value='BIDÓN'}
 if(t.dataset.photo&&t.files[0]){const f=t.files[0],o=O(t.dataset.id),r=new FileReader();r.onload=()=>{o.photos.push({kind:t.dataset.photo,url:r.result});audNow(`${S.user.name} subió “${t.dataset.photo}” al pedido ${opn(o.id)}`,o.id);const bid=t.dataset.box||('ph-'+o.id),box=byId(bid);if(box)box.innerHTML=o.photos.filter(p=>(p.kind==='Foto del remito')===(t.dataset.photo==='Foto del remito')).map(p=>`<div class="photo"><img src="${p.url}" alt="${esc(p.kind)}"><span>${esc(p.kind)}</span></div>`).join('');toast('Foto cargada.')};r.readAsDataURL(f)}
});
document.addEventListener('focusout',e=>{if(e.target.id==='gq')setTimeout(()=>{const b=byId('gq-res');if(b&&!b.contains(document.activeElement))b.hidden=true},180)});
render();
</script>
</body></html>
