<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style>
<title>Sistema Conte Nic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar oscura fija + área de trabajo clara; herramienta operativa, tarjetas y tablas simples */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface2:#F7F8F4; --ink:#17212B; --muted:#5A6570; --line:#DADDD4; --line2:#E8EAE3;
  --accent:#C9520A; --accent-2:#FCE7D6; --accent-ink:#FFFFFF; --focus:#2B6CB0;
  --side:#16202B; --side-ink:#D9E0E6; --side-muted:#8E9BA8; --side-hi:#243343;
  --ok:#1F6F44; --ok-bg:#DFF1E5; --warn:#8F5A00; --warn-bg:#FBEFCF; --bad:#B02A21; --bad-bg:#FADFDB;
  --info:#1D5A97; --info-bg:#DDEAF7; --rep:#673FA0; --rep-bg:#ECE3F7; --off:#5A6570; --off-bg:#E7E9E3;
  --map-bg:#EEF0E7; --map-hill:#DEE4D2; --map-hill2:#D0D9C2; --map-road:#DF9A55; --map-water:#B7D4EA; --map-text:#46515C;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 10px 30px rgba(23,33,43,.08);
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D26; --surface2:#1A242E; --ink:#E6EBEF; --muted:#98A4AF; --line:#29353F; --line2:#202A34;
  --accent:#F07E34; --accent-2:#3A2415; --accent-ink:#17110C; --focus:#7DB4F0;
  --side:#0A0F14; --side-ink:#D9E0E6; --side-muted:#7E8C99; --side-hi:#18232E;
  --ok:#62C98E; --ok-bg:#15301F; --warn:#E9B24C; --warn-bg:#33280F; --bad:#F2837A; --bad-bg:#3B1A17;
  --info:#74AEEA; --info-bg:#152A40; --rep:#B696EA; --rep-bg:#2A1F3E; --off:#98A4AF; --off-bg:#222C36;
  --map-bg:#121A21; --map-hill:#19232C; --map-hill2:#202D38; --map-road:#B8702F; --map-water:#1E3D56; --map-text:#A5B0BA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D26; --surface2:#1A242E; --ink:#E6EBEF; --muted:#98A4AF; --line:#29353F; --line2:#202A34;
  --accent:#F07E34; --accent-2:#3A2415; --accent-ink:#17110C; --focus:#7DB4F0;
  --side:#0A0F14; --side-ink:#D9E0E6; --side-muted:#7E8C99; --side-hi:#18232E;
  --ok:#62C98E; --ok-bg:#15301F; --warn:#E9B24C; --warn-bg:#33280F; --bad:#F2837A; --bad-bg:#3B1A17;
  --info:#74AEEA; --info-bg:#152A40; --rep:#B696EA; --rep-bg:#2A1F3E; --off:#98A4AF; --off-bg:#222C36;
  --map-bg:#121A21; --map-hill:#19232C; --map-hill2:#202D38; --map-road:#B8702F; --map-water:#1E3D56; --map-text:#A5B0BA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.code{font-family:var(--f-cond);font-variant-numeric:tabular-nums}
.code{font-weight:600;font-size:16px;letter-spacing:.02em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.brand b{font:700 21px/1 var(--f-cond);letter-spacing:.02em;display:block;color:#F3F1EC}
.brand small{font-size:12px;color:var(--side-muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;background:transparent;border-radius:9px;color:var(--side-ink);font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:var(--side-hi)}
.nav button.on{background:var(--side-hi);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{margin-left:auto;font:600 12px/1 var(--f-body);padding:4px 8px;border-radius:999px;background:#3A2517;color:#FFB37A}
.nav .cnt.bad{background:#46201C;color:#FF9E94}
.me{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--side-hi)}
.me-row{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-cond);background:var(--accent);color:#fff;flex:none}
.me b{display:block;color:#fff}
.me small{color:var(--side-muted)}
.me button{min-height:36px;border:1px solid #33475A;background:transparent;color:var(--side-ink);border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.me button:hover{background:#2C3E50}

.main{min-width:0;padding:0 28px 56px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);margin-bottom:22px}
.menu{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;place-items:center}
.gs{position:relative;flex:1;max-width:560px}
.gs .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gs input{width:100%;min-height:44px;padding:0 14px 0 40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--f-body)}
.gs-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
.gs-res[hidden]{display:none}
.gs-res button{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:0;background:transparent;padding:10px;border-radius:8px;cursor:pointer}
.gs-res button:hover,.gs-res button:focus-visible{background:var(--surface2)}
.gs-res .k{font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:78px;flex:none}
.gs-res .t{min-width:0}
.gs-res .t small{display:block;color:var(--muted)}
.demo{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border:1px dashed var(--line);border-radius:999px;white-space:nowrap}

.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.ph h1{font:600 34px/1.05 var(--f-cond);letter-spacing:.01em}
.ph .sub{color:var(--muted);margin-top:4px}
.ph-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sec{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.block{margin-bottom:22px}

/* buttons, chips, badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.big{min-height:52px;font-size:16px;padding:0 22px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--bad-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip span{font-weight:500;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on span{color:inherit;opacity:.75}
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;line-height:1.35}
.b::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.ok{color:var(--ok);background:var(--ok-bg)}.warn{color:var(--warn);background:var(--warn-bg)}.bad{color:var(--bad);background:var(--bad-bg)}
.info{color:var(--info);background:var(--info-bg)}.rep{color:var(--rep);background:var(--rep-bg)}.off{color:var(--off);background:var(--off-bg)}.acc{color:var(--accent);background:var(--accent-2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.info{background:var(--info)}.dot.rep{background:var(--rep)}.dot.off{background:var(--off)}.dot.acc{background:var(--accent)}
.sz{display:inline-block;font:600 13px var(--f-cond);padding:2px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.2);vertical-align:middle;margin-right:6px}

/* dashboard */
.pc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rng{display:flex;gap:8px;align-items:center}
.rng input{min-height:38px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 14px var(--f-body)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;padding:16px 18px;min-height:112px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tile:hover{border-color:var(--muted)}
.tl-l{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:14px}
.tl-n{font:600 46px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.tile.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tile.dark .tl-l{color:inherit;opacity:.75}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h3{font:600 20px/1.1 var(--f-cond);letter-spacing:.01em;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel h3 small{font:500 13px var(--f-body);color:var(--muted)}
.kv{display:flex;flex-direction:column}
.kv-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.kv-row:first-child{border-top:0;padding-top:0}
.kv-row b{font:600 30px/1 var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv-row .l{min-width:0}
.kv-row .l{font-weight:600}
.kv-row .l small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.hb{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) 58px;align-items:center;gap:12px;padding:6px 0}
.hb-l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line2)}
.hb-t i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hb-v{text-align:right;font:600 18px var(--f-cond);font-variant-numeric:tabular-nums}
.hb small{color:var(--muted);font-weight:500}
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);text-align:left;cursor:pointer;width:100%}
.al:hover{border-color:var(--muted)}
.al b{display:block}
.al small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .n{font:600 30px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.al .n.zero{color:var(--muted)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart text{fill:var(--muted);font:12px var(--f-body)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .ce{fill:var(--accent)}
.chart .cr{fill:var(--info)}
.chart .today{fill:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;list-style:none;padding:0;margin:10px 0 0;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}

/* filters + tables */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters .grow{flex:1 1 240px;min-width:0}
.inp,.sel{min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--f-body);max-width:100%}
.inp{width:100%}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
td .sub{display:block;color:var(--muted);font-size:13px}
.late{color:var(--bad);font-weight:600}
.note{color:var(--muted);font-size:14px;margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* layers */
.layer{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.layer.dr{place-items:stretch;justify-items:end;padding:0}
.layer.dg{z-index:70}
.backdrop{position:absolute;inset:0;background:rgba(9,14,19,.52)}
.mpanel{position:relative;width:100%;max-width:1040px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mpanel.narrow{max-width:560px}
.dpanel{position:relative;width:min(600px,100%);height:100%;overflow:auto;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:2}
.m-head h2{font:600 30px/1.05 var(--f-cond)}
.m-head .eyebrow{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.m-head .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.m-body{padding:20px 24px;display:flex;flex-direction:column;gap:22px}
.m-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--surface)}
.m-foot .spacer{flex:1}
.op-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.sect{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.sect h3{font:600 19px/1.1 var(--f-cond);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sect h3 .who{font:500 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
dl.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0}
dl.dl dt{color:var(--muted);font-size:14px}
dl.dl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-weight:600;font-size:14px}
.fld input,.fld select,.fld textarea{font:500 15px var(--f-body);min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:64px}
.full{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;display:inline-flex}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;background:var(--surface)}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-2)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--bad);font-weight:600}
.warn-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line)}
.ok-box{padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ink)}
.selcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--accent);background:var(--accent-2);border-radius:10px}
.sug{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sug button{display:flex;justify-content:space-between;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.sug button:hover{border-color:var(--accent)}
.sug small{color:var(--muted)}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photo{width:150px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.photo img,.photo svg{width:150px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.up{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1.5px dashed var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface2)}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px;margin-left:6px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--off)}

function pickCustomer(){const r=R();if(r<.13)return DB.customers[0];if(r<.23)return pick(DB.customers.slice(1,6));return pick(DB.customers.slice(6))}

function newOp(o){
 const op=Object.assign({id:++DB.seq.op,type:'Alquiler',size:5,customerId:null,addrId:null,reqDay:TODAY,hour:'',price:0,payMethod:'Efectivo',obs:'',status:'Pendiente de asignación',
  containerId:null,driverId:null,remito:null,firmado:false,delDay:null,delMin:null,plannedPickup:null,pickDay:null,pickMin:null,pickDriverId:null,pickResult:null,
  replacesOpId:null,closedByRecambio:false,photos:[],demoPhoto:false,paid:0,payDay:null,receipt:null,createdBy:'Belén',createdDay:TODAY,pickDriverPlan:null,logObs:''},o);
 DB.ops.push(op);return op;
}
function doAssign(op,cid,drv,day,min,user,log){
 const c=C(cid);op.containerId=cid;op.driverId=drv;op.pickDriverPlan=op.pickDriverPlan||drv;if(!op.remito)op.remito=++DB.seq.remito;
 c.status='En cliente';c.opId=op.id;op.status='Programada';
 if(log)mv(day,min,cid,`Asignado a la operación ${opn(op.id)} (${cust(op).name})`,'asignado',op.id,drv);
 aud(day,min,user,`${user} asignó ${cid} y a ${dname(drv)} a la operación ${opn(op.id)}`,op.id);
}
function doDeliver(op,day,min,user,plazo){
 op.status='Entregada';op.delDay=day;op.delMin=min;op.plannedPickup=nextWork(day+plazo);
 mv(day,min,op.containerId,`Entregado a ${cust(op).name}`,'entregado',op.id,op.driverId);
 aud(day,min,user,`${user} registró la entrega de ${op.containerId} (operación ${opn(op.id)})`,op.id);
 if(op.type==='Recambio'&&op.replacesOpId){const old=O(op.replacesOpId);if(old&&isActive(old))doPickup(old,day,min+5,op.driverId,'Disponible',user,true)}
}
function doPickup(op,day,min,drv,result,user,recambio){
 op.status='Retirada';op.pickDay=day;op.pickMin=min;op.pickDriverId=drv;op.pickResult=result;op.closedByRecambio=!!recambio;
 const c=C(op.containerId);c.opId=null;
 mv(day,min,c.id,recambio?`Retirado por recambio en ${cust(op).name}`:`Retirado de ${cust(op).name}`,'retirado',op.id,drv);
 if(result==='En reparación'){c.status='En reparación';mv(day,min+1,c.id,'Enviado a reparación','reparacion',op.id)}
 else{c.status='Disponible';mv(day,min+1,c.id,'Disponible en depósito','disponible',op.id)}
 aud(day,min,user,`${user} registró el retiro de ${c.id} (operación ${opn(op.id)})`,op.id);
}
function simPay(op){
 if(op.payMethod==='Cliente aparte')return;
 const age=TODAY-op.delDay;const p=age>10?.95:age>3?.86:.6;
 if(R()<p){op.paid=op.price;op.payDay=Math.min(TODAY,op.delDay+(R()<.7?0:ri(1,6)));if(op.payMethod==='Transferencia')op.receipt=`transferencia_${op.remito}.jpg`;
  aud(op.payDay,ri(10*60,19*60),'Francisco',`Francisco registró un pago de ${money(op.price)} en la operación ${opn(op.id)}`,op.id)}
 else if(R()<.15){op.paid=Math.round(op.price/2/1000)*1000;op.payDay=op.delDay}
}
let active=[];
function makeOp(d,h,{assign=true,creator='Belén',createdDay=d,log=false}={}){
 const cand=active.filter(o=>o.delDay<=d-2&&!DB.ops.some(x=>x.replacesOpId===o.id&&x.status!=='Cancelada'));
 const isRec=R()<.25&&cand.length>0;
 let cu,addrId,size,old=null;
 if(isRec){old=pick(cand);cu=cust(old);addrId=old.addrId;size=old.size}
 else{cu=pickCustomer();addrId=pick(cu.addrs).id;size=wpick([3,5,6],[10,78,12])}
 let c=null;
 if(assign){c=avail(size)||avail(5)||avail(6)||avail(3);if(!c)return null;size=c.size}
 const op=newOp({type:isRec?'Recambio':'Alquiler',size,customerId:cu.id,addrId,reqDay:d,hour:fmin(Math.round(h/15)*15),price:cu.name==='Grupo Chamba'?125000:pick(PRICES[size]),
  createdBy:creator,createdDay,replacesOpId:old?old.id:null,status:'Pendiente de asignación'});
 op.payMethod=cu.name==='Grupo Chamba'?'Grupo Chamba':wpick(['Transferencia','Efectivo','Cliente aparte'],[55,38,7]);
 if(R()<.12)op.obs=pick(['Dejar dentro del lote','Llamar antes de llegar','Portón negro, perro suelto','Vereda angosta, entrar marcha atrás','Obra en construcción, preguntar por el capataz']);
 aud(createdDay,createdDay===d?Math.max(7*60,h-ri(60,180)):ri(9*60,18*60),creator,`${creator} creó la operación ${opn(op.id)} (${cu.name})`,op.id);
 if(assign)doAssign(op,c.id,drvPick(),Math.min(d,TODAY),log&&d>TODAY?ri(12*60,SIMNOW):Math.max(7*60,h-30),'Lucía',log);
 return op;
}
(function simulate(){
 for(let d=TODAY-42;d<TODAY;d++){
  if(dow(d)===0)continue;
  DB.containers.forEach(c=>{if(c.status==='En reparación'&&c.repairUntil!=null&&c.repairUntil<=d){c.status='Disponible';c.repairUntil=null;mv(d,8*60,c.id,'Reparado, vuelve a estar disponible','disponible')}});
  let m=8*60+ri(0,20);
  active.filter(o=>o.actualPickup<=d).forEach(op=>{m+=ri(20,45);const res=R()<.06?'En reparación':'Disponible';doPickup(op,d,m,wpick([1,2,3],[38,45,17]),res,'Lucía',false);if(res==='En reparación')C(op.containerId).repairUntil=d+ri(2,6)});
  active=active.filter(o=>o.status!=='Retirada');
  const n=dow(d)===6?ri(4,7):ri(11,15);let h=7*60+30;
  for(let i=0;i<n;i++){h+=ri(25,50);const op=makeOp(d,h,{createdDay:d-(R()<.6?1:0)});if(!op)continue;
   const old=op.replacesOpId?O(op.replacesOpId):null;
   doDeliver(op,d,h+ri(0,15),'Lucía',PLAZO());
   if(old)active=active.filter(o=>o!==old);
   op.actualPickup=Math.max(d+1,op.plannedPickup+wpick([0,-1,1,2],[74,10,10,6]));
   op.firmado=R()<.82;op.demoPhoto=R()<.6;simPay(op);active.push(op)}
 }
 const d=TODAY;
 if(dow(d)!==0){
  DB.containers.forEach(c=>{if(c.status==='En reparación'&&c.repairUntil!=null&&c.repairUntil<=d){c.status='Disponible';c.repairUntil=null;mv(d,8*60,c.id,'Reparado, vuelve a estar disponible','disponible')}});
  let m=8*60+10;
  active.filter(o=>o.actualPickup<=d).forEach(op=>{if(R()<.5&&m+45<SIMNOW){m+=ri(25,45);doPickup(op,d,m,drvPick(),'Disponible','Lucía',false)}});
  active=active.filter(o=>o.status!=='Retirada');
 }
 const n=dow(d)===0?2:dow(d)===6?5:ri(10,12);let enc=0;
 for(let i=0;i<n;i++){
  const h=8*60+i*42;
  if(i>=n-2){const op=makeOp(d,h+60,{assign:false,createdDay:d});if(op&&i===n-1)op.status='Nueva';continue}
  const op=makeOp(d,h,{createdDay:d-1,log:true});if(!op)continue;
  if(h+25<SIMNOW){const old=op.replacesOpId?O(op.replacesOpId):null;doDeliver(op,d,h+ri(0,20),'Lucía',PLAZO());if(old)active=active.filter(o=>o!==old);op.firmado=R()<.7;op.demoPhoto=R()<.6;simPay(op);active.push(op)}
  else if(h<SIMNOW+60&&enc<2){op.status='En camino';enc++;aud(d,SIMNOW-ri(5,20),'Lucía',`Lucía marcó “en camino” la operación ${opn(op.id)}`,op.id)}
 }
 const t=nextWork(d+1);
 for(let i=0;i<5;i++)makeOp(t,8*60+i*55,{assign:i<2,createdDay:d,log:true});
 // cancelada para variedad
 const cx=makeOp(TODAY-3,10*60,{assign:false,createdDay:TODAY-4});if(cx){cx.status='Cancelada';aud(TODAY-3,9*60+12,'Belén',`Belén canceló la operación ${opn(cx.id)} (el cliente reprogramó la obra)`,cx.id)}
 // estado final
 DB.ops.forEach(o=>{if(o.status==='Entregada'&&o.plannedPickup<=TODAY){o.status='Pendiente de retiro';C(o.containerId).status='Pendiente de retiro'}});
 DB.ops.forEach(o=>{if(!o.payMethod)o.payMethod='Efectivo'});
 // algunos alquileres vencidos (el cliente no avisó / no se pudo retirar)
 DB.ops.filter(o=>isActive(o)&&o.delDay<=TODAY-5&&o.plannedPickup>=TODAY).slice(0,3).forEach((o,i)=>{o.plannedPickup=TODAY-[1,2,4][i];o.status='Pendiente de retiro';C(o.containerId).status='Pendiente de retiro'});
 // en reparación
 DB.containers.filter(c=>c.status==='Disponible').slice(0,3).forEach((c,i)=>{c.status='En reparación';c.obs=['Soldar esquina inferior','Cambiar ganchos de izaje','Pintura y enderezado de puerta'][i];mv(TODAY-1-i,16*60,c.id,'Enviado a reparación','reparacion');aud(TODAY-1-i,16*60,'Lucía',`Lucía cambió el estado de ${c.id} a En reparación`,c.id)});
 // sin ubicación
 const act=DB.ops.filter(o=>isActive(o)&&!cust(o).company);
 [act[3],act[11]].filter(Boolean).forEach((o,i)=>{const a=addr(o);a.lat=null;a.lng=null;a.street=i?'Camino a Los Hornillos s/n, km 3':'Pasaje sin nombre, detrás de la capilla'});
 // reclamos
 const cl=DB.customers.slice(6);
 DB.claims.push({id:1,customerId:cl[4].id,day:TODAY-9,text:'El contenedor quedó mal ubicado, tapaba la entrada del garage.',status:'Resuelto'});
 DB.claims.push({id:2,customerId:cl[17].id,day:TODAY-4,text:'Pidió el retiro el viernes y se retiró el lunes.',status:'Resuelto'});
 DB.claims.push({id:3,customerId:DB.customers[1].id,day:TODAY-1,text:'Consulta por factura del mes pasado, no le llegó el PDF.',status:'Abierto'});
 // cambios de estado de contenedores
 DB.containers.filter(c=>c.status==='Fuera de servicio').slice(0,3).forEach((c,i)=>{mv(TODAY-20+i*5,11*60,c.id,'Pasa a fuera de servicio','fuera');aud(TODAY-20+i*5,11*60,'Francisco',`Francisco cambió el estado de ${c.id} a Fuera de servicio`,c.id)});
})();

function stats(a,b){
 const inR=d=>d!=null&&d>=a&&d<=b;
 const r={ent:0,rec:0,ret:0,entPlan:0,recPlan:0,cobrado:0,facturado:0,byDrv:{},byLoc:{}};
 DB.drivers.forEach(d=>r.byDrv[d.id]={ent:0,rec:0,ret:0});
 DB.ops.forEach(o=>{
  if(o.status==='Cancelada')return;
  if(inR(o.delDay)){o.type==='Recambio'?r.rec++:r.ent++;r.facturado+=o.price;const dd=r.byDrv[o.driverId];if(dd)o.type==='Recambio'?dd.rec++:dd.ent++;const l=addr(o).loc;r.byLoc[l]=(r.byLoc[l]||0)+1}
  if(inR(o.pickDay)&&!o.closedByRecambio){r.ret++;const dd=r.byDrv[o.pickDriverId];if(dd)dd.ret++}
  if(inR(o.payDay))r.cobrado+=o.paid;
  if(inR(o.reqDay))o.type==='Recambio'?r.recPlan++:r.entPlan++;
 });
 return r;
}

function periodCtl(){
 const P=[['hoy','Hoy'],['semana','Esta semana'],['mes','Este mes'],['rango','Rango']];
 return `<div class="pc"><div class="chips" role="group" aria-label="Período">${P.map(([k,l])=>`<button class="chip ${S.period===k?'on':''}" data-act="period" data-p="${k}">${l}</button>`).join('')}</div>${S.period==='rango'?`<div class="rng"><input type="date" id="rf" data-f="from" value="${dOut(S.from)}" aria-label="Desde"><span>a</span><input type="date" id="rt" data-f="to" value="${dOut(S.to)}" aria-label="Hasta"></div>`:''}</div>`;
}
const tile=(l,v,dot,st,dark)=>`<button class="tile ${dark?'dark':''}" data-act="goCont" data-st="${st}"><span class="tl-l">${dot?`<i class="dot ${dot}"></i>`:''}${l}</span><span class="tl-n">${v}</span></button>`;
const hbars=(rows,fmt)=>{const max=Math.max(1,...rows.map(r=>r.v));return rows.map(r=>`<div class="hb"><span class="hb-l">${r.l}</span><span class="hb-t"><i style="width:${r.v/max*100}%"></i></span><span class="hb-v">${fmt?fmt(r.v):r.v}</span></div>`).join('')};

function dayChart(a,b){
 if(b-a<6)a=b-13;
 const days=[];for(let d=a;d<=b;d++)days.push(d);
 const map={};days.forEach(d=>map[d]={e:0,r:0});
 DB.ops.forEach(o=>{if(o.status==='Cancelada')return;if(map[o.delDay])map[o.delDay].e++;if(map[o.pickDay]&&!o.closedByRecambio)map[o.pickDay].r++});
 const max=Math.max(4,...days.map(d=>map[d].e+map[d].r)),top=Math.ceil(max/5)*5;
 const step=days.length>24?22:28,bw=step-8,W=44+days.length*step,H=190,ch=150,y0=16;
 const Y=v=>y0+ch-(v/top*ch);
 let s=`<svg viewBox="0 0 ${W} ${H+14}" role="img" aria-label="Servicios por día">`;
 [0,top/2,top].forEach(v=>{s+=`<line class="gl" x1="36" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/><text x="30" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
 days.forEach((d,i)=>{const x=40+i*step,{e,r}=map[d];
  s+=`<g><title>${fs(d)}: ${e} entregas/recambios, ${r} retiros</title><rect class="ce" x="${x}" y="${Y(e)}" width="${bw}" height="${Math.max(0,Y(0)-Y(e))}" rx="2"/><rect class="cr" x="${x}" y="${Y(e+r)}" width="${bw}" height="${Math.max(0,Y(e)-Y(e+r))}" rx="2"/></g>`;
  if(days.length<=24||i%2===(days.length-1)%2)s+=`<text x="${x+bw/2}" y="${y0+ch+18}" text-anchor="middle" class="${d===TODAY?'today':''}">${Dt(d).getUTCDate()}</text>`});
 s+=`<text x="${40+(days.length-1)*step+bw/2}" y="${y0+ch+34}" text-anchor="middle" class="today">hoy</text>`;
 return `<div class="chart">${s}</svg></div><ul class="legend"><li><i class="dot acc"></i>Entregas y recambios</li><li><i class="dot info"></i>Retiros</li></ul>`;
}

/* ---------- Operaciones ---------- */
const OSTS=['Nueva','Pendiente de asignación','Programada','En camino','Entregada','Pendiente de retiro','Retirada','Cancelada'];
function vOps(){
 const f=S.of,q=norm(f.q),qd=digits(f.q);
 const[wa,wb]=f.when==='hoy'?[TODAY,TODAY]:f.when==='manana'?[nextWork(TODAY+1),nextWork(TODAY+1)]:f.when==='semana'?range('semana'):f.when==='mes'?range('mes'):[-1e9,1e9];
 const base=DB.ops.filter(o=>o.reqDay>=wa&&o.reqDay<=wb&&(!f.type||o.type===f.type)&&(!q||norm(cust(o).name).includes(q)||(o.containerId&&norm(o.containerId).includes(q))||(qd.length>=3&&String(o.id).includes(qd))||norm(addr(o).loc).includes(q)));
 const cnt={};base.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
 const list=base.filter(o=>!f.st||o.status===f.st).sort((a,b)=>b.reqDay-a.reqDay||b.id-a.id);
 const chip=(st,l)=>`<button class="chip ${f.st===st?'on':''}" data-act="set" data-k="of.st" data-v="${st}">${l} <span>${st?cnt[st]||0:base.length}</span></button>`;
 return pageHead('Operaciones','Cada operación es un servicio: alquiler o recambio',can.createOp()?`<button class="btn pri big" data-act="newOp">${ic('plus')}Nueva operación</button>`:'')+`
 <div class="filters"><div class="chips">${chip('','Todas')}${OSTS.filter(s=>cnt[s]||f.st===s).map(s=>chip(s,s)).join('')}</div></div>
 <div class="filters">
  <input class="inp grow" id="ofq" data-f="of.q" value="${esc(f.q)}" placeholder="Buscar por cliente, contenedor, número o localidad" aria-label="Buscar operación">
  <select class="sel" id="ofw" data-f="of.when" aria-label="Fecha"><option value="">Todas las fechas</option><option value="hoy" ${f.when==='hoy'?'selected':''}>Hoy</option><option value="manana" ${f.when==='manana'?'selected':''}>Próximo día hábil</option><option value="semana" ${f.when==='semana'?'selected':''}>Esta semana</option><option value="mes" ${f.when==='mes'?'selected':''}>Este mes</option></select>
  <select class="sel" id="oft" data-f="of.type" aria-label="Tipo"><option value="">Alquiler y recambio</option><option ${f.type==='Alquiler'?'selected':''}>Alquiler</option><option ${f.type==='Recambio'?'selected':''}>Recambio</option></select>
 </div>
 <div class="tbl-wrap"><table><thead><tr><th>N°</th><th>Fecha</th><th>Tipo</th><th>Cliente</th><th>Localidad</th><th>Contenedor</th><th>Chofer</th><th>Estado</th><th>Pago</th></tr></thead><tbody>
 ${list.slice(0,150).map(o=>`<tr data-act="openOp" data-id="${o.id}" tabindex="0"><td class="code">${opn(o.id)}</td><td class="tnum">${fs(o.reqDay)}${o.hour?`<span class="sub">${o.hour}</span>`:''}</td><td>${o.type} ${sz(o.size)}</td><td><b>${esc(cust(o).name)}</b></td><td>${esc(addr(o).loc)}</td><td class="code">${o.containerId||'<span class="muted" style="font-family:var(--f-body);font-size:14px;font-weight:500">Sin asignar</span>'}</td><td>${o.driverId?esc(dname(o.driverId)):'—'}</td><td>${badge(o.status,BO)}</td><td>${o.status==='Cancelada'?'—':badge(payStatus(o),BP)}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">No hay operaciones con esos filtros.</td></tr>`}
 </tbody></table></div>${list.length>150?`<p class="note">Mostrando las 150 más recientes de ${list.length}. Filtrá por fecha o estado para ver otras.</p>`:''}`;
}
const PRE=['Nueva','Pendiente de asignación','Programada'];
function mOp(){
 const o=O(S.modal.id);if(!o)return '';
 const cu=cust(o),a=addr(o),ps=payStatus(o),rep=o.replacesOpId?O(o.replacesOpId):null;
 const editC=S.editCom===o.id&&can.com();
 const com=editC?`<div class="fgrid">
   <label class="fld"><span>Fecha</span><input type="date" id="ec-d" value="${dOut(o.reqDay)}"></label><label class="fld"><span>Horario</span><input type="time" id="ec-h" value="${esc(o.hour)}"></label>
   <label class="fld"><span>Precio</span><input id="ec-p" inputmode="numeric" value="${o.price}"></label>
   <label class="fld"><span>Forma de pago</span><select id="ec-m">${PAY_METHODS.map(m=>`<option ${o.payMethod===m?'selected':''}>${m}</option>`).join('')}</select></label>
   <label class="fld full"><span>Observaciones</span><textarea id="ec-o">${esc(o.obs)}</textarea></label>
   <div class="full" style="display:flex;gap:8px"><button class="btn sm pri" data-act="saveCom" data-id="${o.id}">Guardar</button><button class="btn sm ghost" data-act="editCom" data-id="">Cancelar</button></div></div>`
  :`<dl class="dl"><dt>Cliente</dt><dd><a href="#" data-act="openCust" data-id="${cu.id}">${esc(cu.name)}</a></dd><dt>Teléfono</dt><dd>${esc(cu.phone)}</dd><dt>Dirección</dt><dd>${esc(a.street)}</dd><dt>Localidad</dt><dd>${esc(a.loc)}</dd>
   <dt>Servicio</dt><dd>${o.type} · Contenedor ${o.size} m³</dd>${rep?`<dt>Reemplaza a</dt><dd><a href="#" data-act="openCont" data-id="${rep.containerId}">${rep.containerId}</a> (${opn(rep.id)})</dd>`:''}
   <dt>Fecha pedida</dt><dd>${fd(o.reqDay)}${o.hour?' · '+o.hour:''}</dd><dt>Precio</dt><dd>${money(o.price)}</dd><dt>Forma de pago</dt><dd>${esc(o.payMethod)}</dd><dt>Observaciones</dt><dd>${esc(o.obs)||'—'}</dd><dt>Cargó</dt><dd>${esc(o.createdBy)} · ${fs(o.createdDay)}</dd></dl>`;
 let lg;
 if(can.log()&&PRE.includes(o.status)){
  const av=DB.containers.filter(c=>c.status==='Disponible');
  const same=av.filter(c=>c.size===o.size),other=av.filter(c=>c.size!==o.size);
  const opt=c=>`<option value="${c.id}" ${o.containerId===c.id?'selected':''}>${c.id} · ${c.size} m³ · ${c.color}</option>`;
  lg=`<div class="fgrid">
   <label class="fld full"><span>Contenedor</span><select id="lg-c"><option value="">Elegí un contenedor disponible…</option>${o.containerId?`<optgroup label="Asignado">${opt(C(o.containerId))}</optgroup>`:''}<optgroup label="Disponibles de ${o.size} m³ (${same.length})">${same.map(opt).join('')}</optgroup><optgroup label="Otros tamaños">${other.map(opt).join('')}</optgroup></select></label>
   <div class="fld full"><span>Chofer</span><div class="seg">${DB.drivers.map(d=>`<label><input type="radio" name="lg-drv" value="${d.id}" ${o.driverId===d.id?'checked':''}><span>${esc(d.name)}</span></label>`).join('')}</div></div>
   <label class="fld"><span>Fecha</span><input type="date" id="lg-d" value="${dOut(o.reqDay)}"></label><label class="fld"><span>Hora</span><input type="time" id="lg-h" value="${esc(o.hour)}"></label>
   <label class="fld"><span>N° de remito</span><input id="lg-r" inputmode="numeric" value="${o.remito||DB.seq.remito+1}"></label>
   <label class="check" style="align-self:end"><input type="checkbox" id="lg-f" ${o.firmado?'checked':''}> Remito firmado</label>
   <label class="fld full"><span>Observaciones de logística</span><textarea id="lg-o" placeholder="Ej.: entrar por calle de tierra">${esc(o.logObs)}</textarea></label>
   <div class="full" style="display:flex;flex-wrap:wrap;gap:8px"><label class="up">${ic('cam')}Foto del contenedor<input type="file" accept="image/*" data-photo="Foto del contenedor" data-id="${o.id}"></label><label class="up">${ic('cam')}Foto del remito<input type="file" accept="image/*" data-photo="Foto del remito" data-id="${o.id}"></label></div>
   <div class="full photos" id="ph-${o.id}">${o.photos.map(p=>`<div class="photo"><img src="${p.url}" alt="${esc(p.kind)}"><span>${esc(p.kind)}</span></div>`).join('')}</div>
   <div class="full" id="lg-err"></div>
   <div class="full"><button class="btn dark" data-act="saveLog" data-id="${o.id}">${ic('check')}${o.status==='Programada'?'Guardar cambios':'Guardar y programar'}</button></div></div>`;
 }else{
  lg=`<dl class="dl"><dt>Contenedor</dt><dd>${o.containerId?`<a href="#" data-act="openCont" data-id="${o.containerId}">${o.containerId}</a>`:'Sin asignar'}</dd><dt>Chofer</dt><dd>${o.driverId?esc(dname(o.driverId)):'—'}</dd>
   <dt>Entrega</dt><dd>${o.delDay!=null?fd(o.delDay)+' · '+fmin(o.delMin):'Programada '+fd(o.reqDay)+(o.hour?' · '+o.hour:'')}</dd>
   <dt>Remito</dt><dd>${o.remito?'N° '+o.remito:'—'} ${o.remito?(o.firmado?badge('Firmado',{Firmado:'ok'}):badge('Sin firmar',{'Sin firmar':'warn'})):''}</dd>
   ${o.plannedPickup!=null?`<dt>Retiro previsto</dt><dd class="${o.plannedPickup<TODAY&&isActive(o)?'late':''}">${fd(o.plannedPickup)}</dd>`:''}
   ${o.pickDay!=null?`<dt>Retirado</dt><dd>${fd(o.pickDay)} · ${esc(dname(o.pickDriverId))}${o.closedByRecambio?' (por recambio)':''}</dd><dt>Resultado</dt><dd>${o.pickResult==='En reparación'?'Fue a reparación':'Volvió disponible'}</dd>`:''}
   ${o.logObs?`<dt>Obs. logística</dt><dd>${esc(o.logObs)}</dd>`:''}</dl>
   ${o.containerId&&o.delDay!=null?`<div class="photos">${photosOf(o)}</div>`:''}
   ${can.log()&&o.remito&&!o.firmado&&o.status!=='Cancelada'?`<div><button class="btn sm" data-act="signRemito" data-id="${o.id}">Marcar remito firmado</button></div>`:''}
   ${can.log()&&isActive(o)?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><label class="fld" style="flex:1 1 160px"><span>Cambiar fecha de retiro</span><input type="date" id="pp-d" value="${dOut(o.plannedPickup)}"></label><button class="btn sm" data-act="savePP" data-id="${o.id}">Guardar fecha</button></div>`:''}`;
 }
 const pg=`<dl class="dl"><dt>Precio</dt><dd>${money(o.price)}</dd><dt>Forma</dt><dd>${esc(o.payMethod)}</dd><dt>Pagado</dt><dd>${money(o.paid)}</dd><dt>Pendiente</dt><dd class="${ps==='Vencido'?'late':''}">${money(Math.max(0,o.price-o.paid))}</dd><dt>Estado</dt><dd>${o.status==='Cancelada'?'—':badge(ps,BP)}</dd><dt>Fecha de pago</dt><dd>${fd(o.payDay)}</dd><dt>Comprobante</dt><dd>${esc(o.receipt)||'—'}</dd></dl>
  ${can.pay()&&o.status!=='Cancelada'&&['Pendiente','Vencido'].includes(ps)?`<div><button class="btn sm" data-act="payDlg" data-id="${o.id}">${ic('cash')}Registrar pago</button></div>`:''}`;
 const B=[];
 if(can.log()){
  if(o.status==='Programada'){B.push(`<button class="btn" data-act="enCamino" data-id="${o.id}">${ic('truck')}Salió a entregar</button>`);B.push(`<button class="btn pri big" data-act="delDlg" data-id="${o.id}">${ic('check')}Registrar entrega</button>`)}
  if(o.status==='En camino')B.push(`<button class="btn pri big" data-act="delDlg" data-id="${o.id}">${ic('check')}Registrar entrega</button>`);
  if(isActive(o))B.push(`<button class="btn pri big" data-act="pickDlg" data-id="${o.id}">${ic('truck')}Registrar retiro</button>`);
 }
 if(o.status==='Entregada'&&(can.log()||can.com()))B.unshift(`<button class="btn" data-act="markPend" data-id="${o.id}">El cliente pidió el retiro</button>`);
 const cancel=can.com()&&PRE.concat(['En camino']).includes(o.status)?`<button class="btn danger" data-act="cancelOp" data-id="${o.id}">Cancelar operación</button>`:'';
 const hist=DB.audit.filter(h=>h.ref===o.id).sort((x,y)=>x.t-y.t);
 return `<div class="m-head"><div><p class="eyebrow">Operación</p><h2 class="code" style="font-size:34px">${opn(o.id)}</h2><div class="meta">${badge(o.status,BO)}<span>${o.type}</span>${sz(o.size)}<span class="muted">${esc(cu.name)} · ${esc(a.loc)}</span></div></div><button class="x" data-act="closeModal" aria-label="Cerrar">${ic('x')}</button></div>
 <div class="m-body"><div class="op-grid">
  <section class="sect"><h3>Comercial <span class="who">Ventas</span></h3>${com}${can.com()&&!editC&&o.status!=='Cancelada'?`<div><button class="btn sm ghost" data-act="editCom" data-id="${o.id}">Editar datos comerciales</button></div>`:''}</section>
  <section class="sect lg"><h3>Logística <span class="who">Logística</span></h3>${lg}</section>
  <section class="sect"><h3>Pago <span class="who">Administración</span></h3>${pg}</section>
 </div>
 <details class="hist"><summary>Historial de cambios de esta operación (${hist.length})</summary><div class="audit">${hist.map(h=>`<div><time>${fs(Math.floor(h.t/1440))} ${fmin(h.t%1440)}</time><span>${esc(h.text)}</span></div>`).join('')}</div></details>
 </div>
 ${B.length||cancel?`<div class="m-foot">${cancel}<span class="spacer"></span>${B.join('')}</div>`:''}`;
}

function custBlock(c){
 if(c)return `<input type="hidden" id="no-cid" value="${c.id}"><div class="selcard"><span><b>${esc(c.name)}</b><br><small class="muted">${esc(c.phone)}</small></span><button type="button" class="btn sm ghost" data-act="noClear">Cambiar</button></div>
  <label class="fld" style="margin-top:12px"><span>Dirección de entrega</span><select id="no-addr" data-chg="noAddr">${c.addrs.map(a=>`<option value="${a.id}">${esc(a.street)} · ${esc(a.loc)}</option>`).join('')}<option value="__new">Otra dirección…</option></select></label>
  <div id="no-newaddr" class="fgrid" style="margin-top:12px" hidden><label class="fld"><span>Nueva dirección</span><input id="no-street2" placeholder="Calle y número o lote y barrio"></label><label class="fld"><span>Localidad</span><select id="no-loc2">${LOC_NAMES.map(l=>`<option>${l}</option>`).join('')}</select></label></div>`;
 return `<input id="no-q" class="inp" data-live="noq" autocomplete="off" placeholder="Buscá por nombre o teléfono, o escribí el nombre de un cliente nuevo" aria-label="Cliente"><div id="no-sug" class="sug"></div>
  <p class="note" style="margin:10px 0 8px">¿Es un cliente nuevo? Completá también:</p>
  <div class="fgrid"><label class="fld"><span>Teléfono</span><input id="no-phone" inputmode="tel" placeholder="3543 55-0000"></label><label class="fld"><span>Localidad</span><select id="no-loc">${LOC_NAMES.map(l=>`<option>${l}</option>`).join('')}</select></label><label class="fld full"><span>Dirección</span><input id="no-street" placeholder="Calle y número o lote y barrio"></label></div>`;
}
function recBlock(){
 if(val('no-type')!=='Recambio')return '';
 const cid=byId('no-cid')&&+byId('no-cid').value;
 if(!cid)return `<div class="warn-box">Para un recambio, primero elegí el cliente.</div>`;
 const act=DB.ops.filter(o=>o.customerId===cid&&isActive(o));
 if(!act.length)return `<div class="warn-box">Este cliente no tiene contenedores en su domicilio. Un recambio necesita uno para reemplazar.</div>`;
 return `<label class="fld"><span>Contenedor que se reemplaza</span><select id="no-repl">${act.map(o=>`<option value="${o.id}">${o.containerId} · ${o.size} m³ · entregado ${fs(o.delDay)} · ${esc(addr(o).street)}</option>`).join('')}</select></label>`;
}
const radios=(name,opts,cur)=>opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<label><input type="radio" name="${name}" value="${v}" ${String(cur)===String(v)?'checked':''}><span>${l}</span></label>`}).join('');

  if(kind==='cam')acts=`<button class="btn pri" data-act="delDlg" data-id="${o.id}">Entregado</button>`;
  if(kind==='ret')acts=`<button class="btn pri" data-act="pickDlg" data-id="${o.id}">Retirado</button>`;

  <span class="jc-top"><span class="time">${kind==='ret'?fs(o.plannedPickup):(o.hour||'—')}</span><span>${kind==='ret'?`<span class="code">${o.containerId}</span>`:`${o.type==='Recambio'?badge('Recambio',{Recambio:'acc'}):''} ${sz(o.size)}`}</span></span>

  <div class="row">${kind!=='ret'&&o.containerId?`<span class="code">${o.containerId}</span>`:''}${o.driverId?`<span>${ic('wheel')} ${esc(dname(kind==='ret'?(o.pickDriverPlan||o.driverId):o.driverId))}</span>`:''}${o.reqDay<TODAY&&kind!=='ret'?'<span class="b bad">Atrasada</span>':''}${late}${o.obs?`<span class="muted">${esc(o.obs)}</span>`:''}</div>
  ${acts?`<div class="acts">${acts}</div>`:''}</article>`;

function vLog(){
 const day=S.lday?nextWork(TODAY+1):TODAY;
 const ops=DB.ops.filter(o=>o.status!=='Cancelada');
 const asig=ops.filter(o=>['Nueva','Pendiente de asignación'].includes(o.status)&&o.reqDay<=day).sort((a,b)=>a.reqDay-b.reqDay||a.hour.localeCompare(b.hour));
 const prog=ops.filter(o=>o.status==='Programada'&&o.reqDay<=day).sort((a,b)=>a.reqDay-b.reqDay||a.hour.localeCompare(b.hour));
 const cam=ops.filter(o=>o.status==='En camino');
 const ret=ops.filter(o=>isActive(o)&&o.plannedPickup<=day).sort((a,b)=>a.plannedPickup-b.plannedPickup);
 const done=[];if(!S.lday){ops.forEach(o=>{if(o.delDay===TODAY)done.push({m:o.delMin,t:`${o.type==='Recambio'?'Recambio':'Entrega'} ${o.containerId}`,s:cust(o).name,d:o.driverId,k:'acc'});if(o.pickDay===TODAY&&!o.closedByRecambio)done.push({m:o.pickMin,t:`Retiro ${o.containerId}`,s:cust(o).name,d:o.pickDriverId,k:'info'})});done.sort((a,b)=>b.m-a.m)}

}

 const pend=Math.max(0,st.facturado-DB.ops.filter(o=>o.delDay!=null&&o.delDay>=a&&o.delDay<=b).reduce((s,o)=>s+o.paid,0));

  <section class="panel"><h3>Por localidad <small>entregas</small></h3>${locs.length?hbars(locs):'<p class="muted">Sin entregas en el período.</p>'}</section>

   <div class="kv" style="margin-top:14px"><div class="kv-row"><span class="l">Total</span><b>${cs.total}</b></div>${segs.map(s=>`<div class="kv-row"><span class="l"><i class="dot ${s[1]}"></i> ${s[0]}</span><b>${s[2]}</b></div>`).join('')}</div></section>
  <section class="panel"><h3>Cobros <small>operaciones entregadas en el período</small></h3><div class="kv"><div class="kv-row"><span class="l">Total facturado</span><b>${money(st.facturado)}</b></div><div class="kv-row"><span class="l">Total cobrado<small>pagos registrados en el período</small></span><b>${money(st.cobrado)}</b></div><div class="kv-row"><span class="l">Total pendiente</span><b style="color:var(--bad)">${money(pend)}</b></div></div></section>
 </div>`;
}

/* ============ acciones ============ */
function setF(path,v){
 if(path==='from'||path==='to'){const d=dIn(v);if(d!=null)S[path]=d;return}
 if(path==='lday'){S.lday=+v;return}
 const[a,b]=path.split('.');if(b)S[a][b]=v;else S[a]=v;
 if(path==='mzoom'&&!v)S.mzoom=null;
}
function findDup(name,phone,exceptId){
 const n=norm(name),p=digits(phone);
 return DB.customers.find(c=>c.id!==exceptId&&((p.length>=7&&digits(c.phone).slice(-7)===p.slice(-7))||(n.length>3&&norm(c.name)===n)));
}

 newUser:()=>{S.modal={t:'user'};renderLayers()},
 saveUser:()=>{const n=byId('nu-n').value.trim(),r=val('nu-r');if(!n){byId('nu-err').innerHTML='<p class="err">Escribí el nombre.</p>';return}
  const descs={'Administrador':'Acceso total.','Ventas':'Carga clientes y nuevos alquileres.','Logística':'Entregas, retiros y remitos.','Dueño':'Indicadores y reportes.'};
  DB.users.push({id:'u'+Date.now(),name:n,role:r,desc:descs[r],last:null});audNow(`${S.user.name} creó el usuario ${n} (${r})`);S.modal=null;render();toast(`Usuario ${n} creado.`)},
 gqGo:d=>{byId('gq').value='';byId('gq-res').hidden=true;if(d.k==='cont')ACT.openCont(d);else if(d.k==='op')ACT.openOp(d);else ACT.openCust(d)}
};
const LIVE={
 gq:t=>{
  const q=norm(t.value),box=byId('gq-res');if(q.length<2){box.hidden=true;box.innerHTML='';return}
  const dg=digits(q),res=[];
  DB.containers.forEach(c=>{if(norm(c.id).includes(q)||(dg&&dg.length<=3&&c.id===`CN-${dg.padStart(3,'0')}`)){const op=c.opId?O(c.opId):null;res.push(`<button data-act="gqGo" data-k="cont" data-id="${c.id}"><span class="k">Contenedor</span><span class="t"><b class="code">${c.id}</b> ${badge(c.status,BC)}<small>${op?`${esc(cust(op).name)} · ${esc(addr(op).street)}, ${esc(addr(op).loc)}`:'En depósito'}</small></span></button>`)}});
  if(dg.length>=3)DB.ops.filter(o=>String(o.id).includes(dg)).slice(0,3).forEach(o=>res.push(`<button data-act="gqGo" data-k="op" data-id="${o.id}"><span class="k">Operación</span><span class="t"><b>${opn(o.id)}</b> · ${esc(cust(o).name)}<small>${o.type} · ${fd(o.reqDay)} · ${o.status}</small></span></button>`));
  DB.customers.filter(c=>norm(c.name).includes(q)||(dg.length>=4&&digits(c.phone).includes(dg))).slice(0,5).forEach(c=>res.push(`<button data-act="gqGo" data-k="cust" data-id="${c.id}"><span class="k">Cliente</span><span class="t"><b>${esc(c.name)}</b><small>${esc(c.phone)} · ${esc(c.addrs[0].loc)}</small></span></button>`));
  box.innerHTML=res.slice(0,8).join('')||'<p class="muted" style="padding:10px">Sin resultados.</p>';box.hidden=false;
 },
 noq:t=>{const q=norm(t.value),dg=digits(t.value),box=byId('no-sug');if(q.length<2){box.innerHTML='';return}
  const l=DB.customers.filter(c=>norm(c.name).includes(q)||(dg.length>=4&&digits(c.phone).includes(dg))).slice(0,6);
  box.innerHTML=l.map(c=>`<button type="button" data-act="pickCust" data-id="${c.id}"><span><b>${esc(c.name)}</b><br><small>${esc(c.addrs[0].street)} · ${esc(c.addrs[0].loc)}</small></span><small>${esc(c.phone)}</small></button>`).join('')},
 ncdup:()=>{const dup=findDup(byId('nc-n').value,byId('nc-p').value);byId('nc-dup').innerHTML=dup?`<div class="warn-box">${ic('alert')}<span>Parecido a un cliente existente: <b>${esc(dup.name)}</b> (${esc(dup.phone)}).</span><button class="btn sm" data-act="openCust" data-id="${dup.id}">Ver cliente</button></div>`:''},
 noAddr:t=>{byId('no-newaddr').hidden=t.value!=='__new'},
 pdrv:t=>{const o=O(t.dataset.id);o.pickDriverPlan=+t.value;audNow(`${S.user.name} asignó a ${dname(+t.value)} el retiro de ${o.containerId}`,o.id);toast(`Retiro de ${o.containerId}: ${dname(+t.value)}.`)},
 payFile:t=>{const f=t.files[0];byId('py-fn').textContent=f?f.name:'Adjuntar foto o PDF'}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.tagName==='INPUT')return;
 const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset,t,e)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.dialog)ACT.closeDialog();else if(S.modal)ACT.closeModal();else if(S.drawer)ACT.closeDrawer();else if(byId('gq-res'))byId('gq-res').hidden=true;return}
 if(e.key==='Enter'){const t=e.target;if(t.matches&&t.matches('tr[data-act],g[data-act]')){e.preventDefault();t.click()}if(t.id==='gq'){const b=document.querySelector('#gq-res button');if(b)b.click()}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){setF(t.dataset.f,t.value);render();return}if(t.dataset.live&&LIVE[t.dataset.live])LIVE[t.dataset.live](t)});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.chg&&LIVE[t.dataset.chg])LIVE[t.dataset.chg](t);
 if(t.name==='no-type')byId('no-rec').innerHTML=recBlock();
 if(t.name==='no-size')byId('no-price').value=DEFP[t.value];
 if(t.dataset.photo&&t.files[0]){const f=t.files[0],o=O(t.dataset.id),r=new FileReader();r.onload=()=>{o.photos.push({kind:t.dataset.photo,url:r.result});audNow(`${S.user.name} subió “${t.dataset.photo}” a la operación ${opn(o.id)}`,o.id);const box=byId('ph-'+o.id);if(box)box.innerHTML=o.photos.map(p=>`<div class="photo"><img src="${p.url}" alt="${esc(p.kind)}"><span>${esc(p.kind)}</span></div>`).join('');toast('Foto cargada.')};r.readAsDataURL(f)}
});
document.addEventListener('focusout',e=>{if(e.target.id==='gq')setTimeout(()=>{const b=byId('gq-res');if(b&&!b.contains(document.activeElement))b.hidden=true},180)});
render();
</script>
</body></html>
